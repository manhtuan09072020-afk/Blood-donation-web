<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - BloodDonation</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #D32F2F;
      --primary-dark: #B71C1C;
      --text-dark: #212121;
      --text-light: #616161;
      --text-lighter: #9E9E9E;
      --white: #FFFFFF;
      --border: #E0E0E0;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: var(--text-dark);
    }

    /* ============ NAVBAR ============ */
    .navbar {
      background: var(--white);
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-bottom: 3px solid var(--primary);
    }

    .navbar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    .navbar-logo-icon {
      font-size: 1.8rem;
    }

    .navbar-logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .navbar-menu {
      display: flex;
      gap: 20px;
    }

    .navbar-link {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }

    .navbar-link:hover {
      color: var(--primary);
    }

    /* ============ REGISTER CONTAINER ============ */
    .register-container {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FAFAFA 0%, #F5F5F5 100%);
      padding: 40px;
    }

    .register-card {
      width: 100%;
      max-width: 600px;
      background: var(--white);
      border-radius: 12px;
      padding: 50px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
    }

    .register-header {
      margin-bottom: 40px;
      text-align: center;
    }

    .register-header h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: var(--text-dark);
    }

    .register-header p {
      color: var(--text-light);
      font-size: 0.95rem;
      margin: 0;
    }

    /* ============ FORM FIELDS ============ */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-row-single {
      grid-column: 1 / -1;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 0.95rem;
    }

    .form-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      padding-right: 44px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s;
      background: var(--white);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-lighter);
    }

    .form-input-icon {
      position: absolute;
      right: 14px;
      pointer-events: none;
      font-size: 1.1rem;
      opacity: 0.5;
    }

    /* ============ SELECT ============ */
    .form-select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s;
      background: var(--white);
      cursor: pointer;
      color: var(--text-dark);
    }

    .form-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
    }

    /* ============ CHECKBOX ============ */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .checkbox-group label {
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text-light);
      margin: 0;
    }

    .checkbox-group a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .checkbox-group a:hover {
      text-decoration: underline;
    }

    /* ============ BUTTONS ============ */
    .btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 16px;
    }

    .btn-submit {
      background: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* ============ LOGIN LINK ============ */
    .login-section {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 0.95rem;
      color: var(--text-light);
    }

    .login-section a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }

    .login-section a:hover {
      color: var(--primary-dark);
    }

    /* ============ FOOTER ============ */
    .footer {
      background: var(--text-dark);
      color: var(--white);
      padding: 40px;
      text-align: center;
      border-top: 3px solid var(--primary);
      opacity: 0.9;
    }

    .footer p {
      margin: 0;
      font-size: 0.95rem;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }

      .register-container {
        padding: 20px;
        min-height: auto;
      }

      .register-card {
        padding: 30px 20px;
      }

      .register-header h1 {
        font-size: 1.5rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <span class="navbar-logo-icon">🩸</span>
      <span class="navbar-logo-text">BloodDonation</span>
    </a>
    <div class="navbar-menu">
      <a href="index.html" class="navbar-link">← Quay lại trang chủ</a>
    </div>
  </nav>

  <!-- REGISTER MAIN -->
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h1>Đăng ký</h1>
        <p>Tạo tài khoản để bắt đầu hành trình hiến máu của bạn</p>
      </div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        
        <!-- Họ Tên - Giới tính -->
        <div class="form-row">
          <div class="form-group">
            <label for="fullname" class="form-label">Họ và tên</label>
            <div class="form-input-wrapper">
              <input 
                type="text" 
                id="fullname" 
                placeholder="Nhập họ tên của bạn..."
                class="form-input"
                required
              >
              <span class="form-input-icon">👤</span>
            </div>
          </div>

          <div class="form-group">
            <label for="gender" class="form-label">Giới tính</label>
            <select id="gender" class="form-select" required>
              <option value="">-- Chọn giới tính --</option>
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
              <option value="other">Khác</option>
            </select>
          </div>
        </div>

        <!-- Email - Số điện thoại -->
        <div class="form-row">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <div class="form-input-wrapper">
              <input 
                type="email" 
                id="email" 
                placeholder="example@email.com"
                class="form-input"
                required
              >
              <span class="form-input-icon">📧</span>
            </div>
          </div>

          <div class="form-group">
            <label for="phone" class="form-label">Số điện thoại</label>
            <div class="form-input-wrapper">
              <input 
                type="tel" 
                id="phone" 
                placeholder="0912345678"
                class="form-input"
                required
              >
              <span class="form-input-icon">📱</span>
            </div>
          </div>
        </div>

        <!-- Ngày sinh - Nhóm máu -->
        <div class="form-row">
          <div class="form-group">
            <label for="dob" class="form-label">Ngày sinh</label>
            <input 
              type="date" 
              id="dob" 
              class="form-input"
              required
            >
          </div>

          <div class="form-group">
            <label for="bloodtype" class="form-label">Nhóm máu</label>
            <select id="bloodtype" class="form-select" required>
              <option value="">-- Chọn nhóm máu --</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
        </div>

        <!-- Địa chỉ -->
        <div class="form-row form-row-single">
          <div class="form-group">
            <label for="address" class="form-label">Địa chỉ</label>
            <div class="form-input-wrapper">
              <input 
                type="text" 
                id="address" 
                placeholder="Nhập địa chỉ của bạn..."
                class="form-input"
                required
              >
              <span class="form-input-icon">📍</span>
            </div>
          </div>
        </div>

        <!-- Mật khẩu - Xác nhận mật khẩu -->
        <div class="form-row">
          <div class="form-group">
            <label for="password" class="form-label">Mật khẩu</label>
            <div class="form-input-wrapper">
              <input 
                type="password" 
                id="password" 
                placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)..."
                class="form-input"
                required
              >
              <span class="form-input-icon">🔒</span>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
            <div class="form-input-wrapper">
              <input 
                type="password" 
                id="confirmPassword" 
                placeholder="Nhập lại mật khẩu..."
                class="form-input"
                required
              >
              <span class="form-input-icon">🔒</span>
            </div>
          </div>
        </div>

        <!-- Terms Checkbox -->
        <div class="checkbox-group">
          <input type="checkbox" id="terms" required>
          <label for="terms">
            Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-submit">Đăng ký tài khoản</button>
      </form>

      <!-- Login Link -->
      <div class="login-section">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2026 Hệ thống Hiến máu nhân đạo. Tất cả quyền được bảo lưu.</p>
  </footer>

  <script>
    function handleRegister(event) {
      event.preventDefault();
      
      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const dob = document.getElementById('dob').value;
      const bloodtype = document.getElementById('bloodtype').value;
      const address = document.getElementById('address').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const terms = document.getElementById('terms').checked;

      // Validation
      if (!fullname) {
        alert('Vui lòng nhập họ tên');
        return;
      }
      if (!email || !email.includes('@')) {
        alert('Vui lòng nhập email hợp lệ');
        return;
      }
      if (!phone || phone.length < 10) {
        alert('Vui lòng nhập số điện thoại hợp lệ');
        return;
      }
      if (!dob) {
        alert('Vui lòng chọn ngày sinh');
        return;
      }
      if (!bloodtype) {
        alert('Vui lòng chọn nhóm máu');
        return;
      }
      if (!address) {
        alert('Vui lòng nhập địa chỉ');
        return;
      }
      if (password.length < 6) {
        alert('Mật khẩu phải chứa ít nhất 6 ký tự');
        return;
      }
      if (password !== confirmPassword) {
        alert('Mật khẩu xác nhận không khớp');
        return;
      }
      if (!terms) {
        alert('Vui lòng đồng ý với điều khoản sử dụng');
        return;
      }

      // Show loading
      const btn = event.target.querySelector('.btn-submit');
      const originalText = btn.textContent;
      btn.textContent = 'Đang xử lý...';
      btn.disabled = true;

      // Simulate registration
      setTimeout(() => {
        btn.textContent = originalText;
        btn.disabled = false;
        alert('✓ Đăng ký thành công! Vui lòng kiểm tra email để xác nhận tài khoản. (Demo)');
        // window.location.href = 'login.html';
      }, 1500);
    }
  </script>

</body>
</html>
