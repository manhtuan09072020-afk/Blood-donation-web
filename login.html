<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - BloodDonation</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #D32F2F;
      --primary-dark: #B71C1C;
      --text-dark: #212121;
      --text-light: #616161;
      --text-lighter: #9E9E9E;
      --white: #FFFFFF;
      --border: #E0E0E0;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: var(--text-dark);
    }

    /* ============ NAVBAR ============ */
    .navbar {
      background: var(--white);
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-bottom: 3px solid var(--primary);
    }

    .navbar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    .navbar-logo-icon {
      font-size: 1.8rem;
    }

    .navbar-logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .navbar-menu {
      display: flex;
      gap: 20px;
    }

    .navbar-link {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }

    .navbar-link:hover {
      color: var(--primary);
    }

    /* ============ LOGIN CONTAINER ============ */
    .login-container {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FAFAFA 0%, #F5F5F5 100%);
      padding: 40px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    /* ============ LEFT SIDE ============ */
    .login-left {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .login-illustration {
      position: relative;
    }

    .illustration-icon {
      font-size: 6rem;
      display: block;
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .login-left h2 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--text-dark);
    }

    .login-left p {
      font-size: 1rem;
      color: var(--text-light);
      line-height: 1.6;
      max-width: 300px;
    }

    /* ============ RIGHT SIDE - FORM ============ */
    .login-right {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 12px;
      padding: 50px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
    }

    .login-header {
      margin-bottom: 40px;
      text-align: center;
    }

    .login-header h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: var(--text-dark);
    }

    .login-header p {
      color: var(--text-light);
      font-size: 0.95rem;
      margin: 0;
    }

    /* ============ FORM FIELDS ============ */
    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 0.95rem;
    }

    .form-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      padding-right: 44px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s;
      background: var(--white);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-lighter);
    }

    .form-input-icon {
      position: absolute;
      right: 14px;
      pointer-events: none;
      font-size: 1.1rem;
      opacity: 0.5;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.6;
      transition: opacity 0.2s;
      z-index: 2;
      padding: 0;
    }

    .toggle-password:hover {
      opacity: 1;
    }

    .form-footer {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: var(--primary-dark);
    }

    /* ============ BUTTONS ============ */
    .btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 16px;
    }

    .btn-submit {
      background: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-google {
      background: #FAFAFA;
      color: var(--text-dark);
      border: 2px solid var(--border);
    }

    .btn-google:hover {
      background: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }

    /* ============ DIVIDER ============ */
    .divider {
      position: relative;
      text-align: center;
      margin: 32px 0;
      color: var(--text-lighter);
      font-size: 0.9rem;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      background: var(--white);
      padding: 0 12px;
      position: relative;
      z-index: 1;
    }

    /* ============ SIGNUP LINK ============ */
    .signup-section {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 0.95rem;
      color: var(--text-light);
    }

    .signup-section a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }

    .signup-section a:hover {
      color: var(--primary-dark);
    }

    /* ============ FOOTER ============ */
    .footer {
      background: var(--text-dark);
      color: var(--white);
      padding: 40px;
      text-align: center;
      border-top: 3px solid var(--primary);
      opacity: 0.9;
    }

    .footer p {
      margin: 0;
      font-size: 0.95rem;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 900px) {
      .login-wrapper {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .login-left {
        order: 2;
      }

      .login-right {
        order: 1;
      }
    }

    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }

      .login-container {
        padding: 20px;
        min-height: auto;
      }

      .login-card {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }

      .illustration-icon {
        font-size: 4rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <span class="navbar-logo-icon">🩸</span>
      <span class="navbar-logo-text">BloodDonation</span>
    </a>
    <div class="navbar-menu">
      <a href="index.html" class="navbar-link">← Quay lại trang chủ</a>
    </div>
  </nav>

  <!-- LOGIN MAIN -->
  <div class="login-container">
    <div class="login-wrapper">
      
      <!-- LEFT SIDE -->
      <div class="login-left">
        <div class="login-illustration">
          <span class="illustration-icon">🩸</span>
          <h2>Hiến máu nhân đạo</h2>
          <p>Một giọt máu cho đi — Một cuộc đời ở lại</p>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="login-right">
        <div class="login-card">
          <div class="login-header">
            <h1>Đăng nhập</h1>
            <p>Vui lòng nhập thông tin tài khoản của bạn</p>
          </div>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Email Field -->
            <div class="form-group">
              <label for="email" class="form-label">Email hoặc số điện thoại</label>
              <div class="form-input-wrapper">
                <input 
                  type="text" 
                  id="email" 
                  placeholder="Nhập email hoặc số điện thoại..."
                  class="form-input"
                  required
                >
                <span class="form-input-icon">📧</span>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="password" class="form-label">Mật khẩu</label>
              <div class="form-input-wrapper">
                <input 
                  type="password" 
                  id="password" 
                  placeholder="Nhập mật khẩu của bạn..."
                  class="form-input"
                  required
                >
                <button type="button" class="toggle-password" onclick="togglePassword()">
                  👁️
                </button>
              </div>
            </div>

            <!-- Forgot Password -->
            <div class="form-footer">
              <a href="#" class="forgot-link">Quên mật khẩu?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-submit">Đăng nhập</button>
          </form>

          <!-- Divider -->
          <div class="divider">
            <span>Hoặc</span>
          </div>

          <!-- Social Login -->
          <button type="button" class="btn btn-google" onclick="alert('Tính năng này sẽ được kích hoạt sau!')">
            🔍 Đăng nhập với Google
          </button>

          <!-- Signup Link -->
          <div class="signup-section">
            Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2026 Hệ thống Hiến máu nhân đạo. Tất cả quyền được bảo lưu.</p>
  </footer>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
    }

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email) {
        alert('Vui lòng nhập email hoặc số điện thoại');
        return;
      }
      if (!password) {
        alert('Vui lòng nhập mật khẩu');
        return;
      }
      if (password.length < 6) {
        alert('Mật khẩu phải chứa ít nhất 6 ký tự');
        return;
      }

      // Show loading
      const btn = event.target.querySelector('.btn-submit');
      const originalText = btn.textContent;
      btn.textContent = 'Đang xử lý...';
      btn.disabled = true;

      // Simulate login
      setTimeout(() => {
        btn.textContent = originalText;
        btn.disabled = false;
        alert('✓ Đăng nhập thành công! (Demo)');
        // window.location.href = 'dashboard.html';
      }, 1500);
    }
  </script>

</body>
</html>
